<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d141f"/>
      <stop offset="100%" stop-color="#131c2b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1100" height="280" rx="14" fill="url(#cardBg)" stroke="#26354d" stroke-width="2"/>
  <text x="550" y="34" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800" fill="#93c5fd" letter-spacing="1.2">
    SURPLUSBRIDGE RUNTIME VOICE &amp; CALLER AI ARCHITECTURE
  </text>

  <!-- Node 1: Microphone & VAD -->
  <g transform="translate(28, 62)">
    <rect width="210" height="145" rx="10" fill="#132235" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="800" fill="#38bdf8">1. MIC &amp; UTTERANCE VAD</text>
    <line x1="16" y1="40" x2="194" y2="40" stroke="#1e3a5f"/>
    <text x="20" y="64" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• 16kHz Mono PCM Stream</text>
    <text x="20" y="86" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• 0.65s Partial Trigger</text>
    <text x="20" y="108" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• 0.55s Fast Finalize</text>
    <text x="20" y="130" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 0.008f RMS Silence Gate</text>
  </g>

  <line x1="238" y1="134" x2="278" y2="134" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 2: Voice AI Model (STT) -->
  <g transform="translate(286, 62)">
    <rect width="235" height="145" rx="10" fill="#122723" stroke="#34d399" stroke-width="1.5"/>
    <text x="117" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="800" fill="#34d399">2. VOICE AI MODEL (STT)</text>
    <line x1="16" y1="40" x2="219" y2="40" stroke="#1b4339"/>
    <text x="18" y="64" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Smart Partial Transcript Reuse</text>
    <text x="18" y="86" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Gemini Native / OpenAI Whisper</text>
    <text x="18" y="108" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• OpenRouter input_audio WAV</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="11.5" fill="#fde68a">• ~400MB Whisper RAM Bypass</text>
  </g>

  <line x1="521" y1="134" x2="561" y2="134" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 3: Chat AI Model (Dialogue) -->
  <g transform="translate(569, 62)">
    <rect width="245" height="145" rx="10" fill="#231c14" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="122" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="800" fill="#fbbf24">3. CHAT AI MODEL (DIALOGUE)</text>
    <line x1="16" y1="40" x2="229" y2="40" stroke="#46351d"/>
    <text x="18" y="64" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• gameplay_caller_turn JSON</text>
    <text x="18" y="86" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Auto-Repair Non-JSON Output</text>
    <text x="18" y="108" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• 900k Token / 4096 Turn Memory</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="11.5" fill="#93c5fd">• Auto Model &amp; Key Failover</text>
  </g>

  <line x1="814" y1="134" x2="854" y2="134" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 4: Live In-Game HUD & TTS -->
  <g transform="translate(862, 62)">
    <rect width="210" height="145" rx="10" fill="#1d182d" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="105" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="800" fill="#c4b5fd">4. IN-GAME HUD &amp; CALLER</text>
    <line x1="16" y1="40" x2="194" y2="40" stroke="#362c54"/>
    <text x="18" y="64" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• 4-Stage Phone Status HUD</text>
    <text x="18" y="86" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Live STT &amp; AI Elapsed Timers</text>
    <text x="18" y="108" font-family="Consolas, monospace" font-size="11.5" fill="#e2e8f0">• Victim Voice Synthesis</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• Zero Main-Thread Stutter</text>
  </g>

  <!-- Bottom Telemetry Strip -->
  <rect x="28" y="226" width="1044" height="34" rx="7" fill="#09131c" stroke="#1e293b"/>
  <text x="550" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#7dd3fc">
    100% Background Thread I/O  •  Analytics &amp; Telemetry Neutralized  •  Auto-Detects Steam Game Updates (.bak Refresh)
  </text>
</svg>
