    </text>

    <!-- Row 1 -->
    <rect x="18" y="76" width="468" height="44" rx="6" fill="#1c1816" stroke="#523f31" stroke-width="1"/>
    <text x="30" y="103" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#f3e8d2">API TOKEN (OPENAI / GEMINI)</text>
    <rect x="236" y="84" width="238" height="28" rx="4" fill="#101a20" stroke="#64748b" stroke-width="1"/>
    <text x="248" y="103" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#f8fafc">AIzaSyDemoKey_••••••••••••</text>

    <!-- Row 2 -->
    <rect x="18" y="128" width="468" height="44" rx="6" fill="#1c1816" stroke="#523f31" stroke-width="1"/>
    <text x="30" y="155" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#f3e8d2">WHISPER OFFLINE FALLBACK</text>
    <rect x="236" y="136" width="238" height="28" rx="4" fill="#231a12" stroke="#d97706" stroke-width="1"/>
    <text x="248" y="155" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fef3c7">Disabled (Saves ~400MB RAM) ▼</text>

    <!-- Row 3 -->
    <rect x="18" y="180" width="468" height="44" rx="6" fill="#1c1816" stroke="#523f31" stroke-width="1"/>
    <text x="30" y="207" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#f3e8d2">CHAT AI MODEL ID (DIALOGUE)</text>
    <rect x="236" y="188" width="238" height="28" rx="4" fill="#101a20" stroke="#64748b" stroke-width="1"/>
    <text x="248" y="207" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#38bdf8">gemini-2.5-flash</text>

    <!-- Row 4 -->
    <rect x="18" y="232" width="468" height="44" rx="6" fill="#1c1816" stroke="#523f31" stroke-width="1"/>
    <text x="30" y="259" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#f3e8d2">VOICE AI MODEL ID (STT)</text>
    <rect x="236" y="240" width="238" height="28" rx="4" fill="#101a20" stroke="#64748b" stroke-width="1"/>
    <text x="248" y="259" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#34d399">gemini-2.5-flash</text>

    <!-- Live HUD Footer -->
    <rect x="18" y="282" width="468" height="22" rx="4" fill="#091f19"/>
    <text x="252" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">
      PHONE HUD: YOUR MIC IS LIVE [STT: 0.38s | AI: 0.94s]
    </text>
  </g>
</svg>
