    <text x="32" y="258" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#f3e8d2">VOICE AI MODEL ID (STT)</text>
    <rect x="292" y="239" width="268" height="28" rx="4" fill="#101a20" stroke="#64748b" stroke-width="1"/>
