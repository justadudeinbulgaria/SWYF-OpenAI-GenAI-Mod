  <text x="44" y="112" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="39" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">SCAM WITH YOUR FRIENDS</text>
  <text x="44" y="152" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23.5" font-weight="800" fill="url(#accentCyan)">OpenAI &amp; Google Gemini GenAI Voice + Chat Mod</text>

  <!-- Subtitle Description (strictly constrained under 560px wide) -->
  <text x="44" y="190" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" fill="#94a3b8">
