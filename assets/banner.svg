    <circle cx="26" cy="30" r="6" fill="#10b981" filter="url(#glow)"/>
    <text x="44" y="25" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" letter-spacing="0.8">REAL-TIME 4-STAGE IN-GAME PHONE &amp; WEBCAM HUD</text>
